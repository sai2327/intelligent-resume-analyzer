{% extends "base.html" %}
{% block title %}Error &middot; Intelligent Resume Analyzer{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-7 col-lg-6">
        <div class="card shadow-sm text-center p-4">
            <div class="card-body">
                <div class="brand-emblem mx-auto mb-3 text-danger border-danger-subtle bg-danger-subtle" style="width: 56px; height: 56px; font-size: 1.75rem;">
                    <i class="bi bi-exclamation-triangle"></i>
                </div>
                <h2 class="display-6 text-danger fw-bold classic-heading mb-2">Something went wrong</h2>
                <p class="lead text-secondary fs-6 mb-4">{{ message }}</p>
                <a href="{{ url_for('index') }}" class="btn btn-primary px-4">
                    <i class="bi bi-house-door me-1"></i>Return to Home
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
