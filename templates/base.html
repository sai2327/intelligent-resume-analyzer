<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Resume Analyzer{% endblock %}</title>
    <!-- Google Fonts: Playfair Display, Plus Jakarta Sans, JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block head %}{% endblock %}
</head>
<body>
    <!-- Header -->
    <header class="app-masthead">
        <div class="container d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center gap-2 flex-wrap">
                <span class="masthead-tag">
                    <i class="bi bi-shield-lock-fill text-warning me-1"></i>Resume Analyzer
                </span>
            </div>
            <div class="d-flex align-items-center gap-3">
                <span class="masthead-engine">
                    <span class="status-pulse-dot"></span>
                    <span class="d-none d-sm-inline">Active</span>
                </span>
            </div>
        </div>
    </header>

    <!-- Main Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark app-navbar mb-4">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('index') }}">
                <span class="brand-emblem"><i class="bi bi-file-earmark-text"></i></span>
                <div class="d-flex flex-column">
                    <span class="brand-title">Resume Analyzer</span>
                    <span class="brand-tagline">ATS Intelligence & Evaluation</span>
                </div>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent" aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarContent">
                <div class="navbar-nav ms-auto align-items-lg-center gap-2 mt-3 mt-lg-0">
                    <a class="nav-link" href="{{ url_for('index') }}">
                        <i class="bi bi-grid-1x2 me-1"></i>Workspace
                    </a>
                    <a class="nav-link" href="{{ url_for('history') }}">
                        <i class="bi bi-graph-up-arrow me-1"></i>ATS Tracker
                    </a>
                    <a class="btn btn-outline-light btn-sm ms-lg-2 masthead-audit-pill" href="{{ url_for('history') }}">
                        <i class="bi bi-clock-history me-1"></i>History
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <main class="container pb-5">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="app-footer">
        <div class="container">
            <div class="row align-items-center gy-3">
                <div class="col-md-6 text-center text-md-start">
                    <div class="fw-bold text-dark brand-footer-name">Resume Analyzer</div>
                    <div class="small text-muted">NLP + Machine Learning powered resume analysis</div>
                </div>
                <div class="col-md-6 text-center text-md-end">
                    <div class="small text-muted">
                        <span class="badge text-bg-light border me-1"><i class="bi bi-shield-check text-success me-1"></i>Secure</span>
                        <span class="badge text-bg-light border"><i class="bi bi-cpu text-primary me-1"></i>ML Powered</span>
                    </div>
                </div>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
